---
# EventListener receives GitHub webhook events and triggers the pipeline
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: helios-listener
  namespace: default
spec:
  serviceAccountName: tekton-triggers-sa
  triggers:
    - name: github-push-trigger
      interceptors:
        - ref:
            name: "github"
          params:
            - name: "secretRef"
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: "eventTypes"
              value: ["push"]
      bindings:
        - ref: github-push
        - ref: helios-defaults
      template:
        ref: helios-trigger-template

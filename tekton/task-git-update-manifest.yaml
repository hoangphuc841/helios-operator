# task-git-update-manifest.yaml - Auto-creates manifests if they don't exist
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-update-manifest
spec:
  params:
    - name: GITOPS_REPO_URL
    - name: MANIFEST_PATH
    - name: NEW_IMAGE_URL
    - name: GITOPS_REPO_BRANCH
  workspaces:
    - name: gitops-repo
  steps:
    - name: update-manifest
      image: alpine/git:v2.26.2
      script: |
        #!/bin/sh
        set -ex

        # Clean workspace before cloning (prevents "directory exists" error on re-runs)
        echo "Cleaning workspace directory..."
        rm -rf $(workspaces.gitops-repo.path)/*
        rm -rf $(workspaces.gitops-repo.path)/.[!.]*

        # With Tekton git-credentials secret annotated (tekton.dev/git-0=https://github.com)
        # git will use credential helper to authenticate for clone/push.
        git clone "$(params.GITOPS_REPO_URL)" "$(workspaces.gitops-repo.path)"
        cd "$(workspaces.gitops-repo.path)"

        git checkout -B "$(params.GITOPS_REPO_BRANCH)"

        git config user.email "tekton-pipeline@helios.dev"
        git config user.name "Tekton Pipeline"

        # Remove any newline that might break sed
        IMAGE_URL=$(echo "$(params.NEW_IMAGE_URL)" | tr -d '\n')

        # Update the image in the manifest file
        sed -i "s#image: .*#image: ${IMAGE_URL}#g" "$(params.MANIFEST_PATH)"

        git add "$(params.MANIFEST_PATH)"
        git commit -m "chore: Update image to ${IMAGE_URL} [skip-ci]" || echo "Nothing to commit"
        git push origin "$(params.GITOPS_REPO_BRANCH)" || echo "Nothing to push"

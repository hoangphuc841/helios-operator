# task-kaniko-build.yaml (Corrected)
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kaniko-build
spec:
  params:
    - name: IMAGE
    - name: DOCKERFILE
      default: ./Dockerfile
    - name: DOCKER_HUB_USERNAME
    - name: DOCKER_HUB_TOKEN
  workspaces:
    - name: source
  results:
    - name: IMAGE_URL
  steps:
    - name: create-docker-config
      image: alpine
      script: |
        #!/bin/sh
        mkdir -p /tekton/home/.docker
        echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n $(params.DOCKER_HUB_USERNAME):$(params.DOCKER_HUB_TOKEN) | base64)\"}}}" > /tekton/home/.docker/config.json

    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.9.0
      env:
        - name: DOCKER_CONFIG
          value: /tekton/home/.docker
      command:
        - /kaniko/executor
      args:
        - --dockerfile=$(params.DOCKERFILE)
        - --context=$(workspaces.source.path)
        - --destination=$(params.IMAGE)
        - --digest-file=/tekton/results/IMAGE_DIGEST

    - name: write-image-url
      image: alpine
      script: |
        #!/bin/sh
        set -e
        echo "$(params.IMAGE)@$(cat /tekton/results/IMAGE_DIGEST)" > $(results.IMAGE_URL.path)
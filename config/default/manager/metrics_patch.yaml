apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: helios-operator-system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            - --metrics-bind-address=:8080
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP

resources:
  - manager.yaml
  - metrics_service.yaml
patches:
  - path: metrics_patch.yaml
    target:
      kind: Deployment
      name: controller-manager
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: helios-operator-system
images:
  - name: controller
    newName: example.com/helios-operator
    newTag: v0.0.1

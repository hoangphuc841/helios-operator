---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: helios-operator-metrics
  namespace: helios-system
  labels:
    app.kubernetes.io/name: helios-operator
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: helios-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: helios-operator
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  namespaceSelector:
    matchNames:
      - helios-system

---
# Kustomization for Helios Operator Monitoring Resources
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: helios-system

resources:
  - servicemonitor.yaml
  - prometheus-rules.yaml

# [PROMETHEUS-WITH-CERTS] The following patch configures the ServiceMonitor
# to securely reference certificates created and managed by cert-manager.
# Additionally, ensure that you uncomment the [METRICS WITH CERTMANAGER] patch under config/default/kustomization.yaml
# to mount the "metrics-server-cert" secret in the Manager Deployment.
#patches:
#  - path: monitor_tls_patch.yaml
#    target:
#      kind: ServiceMonitor

labels:
  - pairs:
      app.kubernetes.io/name: helios-operator
      app.kubernetes.io/component: monitoring
      app.kubernetes.io/part-of: helios-operator

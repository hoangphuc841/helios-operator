---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-platform-helios-io-v1-heliosapp
  failurePolicy: Fail
  name: mheliosapp.kb.io
  rules:
  - apiGroups:
    - platform.helios.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - heliosapps
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-platform-helios-io-v1-heliosapp
  failurePolicy: Fail
  name: vheliosapp.kb.io
  rules:
  - apiGroups:
    - platform.helios.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - heliosapps
  sideEffects: None

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace
namespace: helios-operator-system

# Resources
resources:
  - crd
  - rbac
  - manager
  - webhook
  - samples
  - monitoring
  - network-policy
  - security

# Common labels
commonLabels:
  app.kubernetes.io/name: helios-operator
  app.kubernetes.io/version: "2.0.0"
  app.kubernetes.io/component: operator
  app.kubernetes.io/part-of: helios-platform

# Common annotations
commonAnnotations:
  managed-by: kustomize
  operator.helios.io/version: "2.0.0"

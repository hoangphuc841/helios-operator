apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: helios-operator-webhook-cert
  namespace: helios-operator-system
spec:
  secretName: helios-operator-webhook-cert
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
    - helios-operator-webhook-service.helios-operator-system.svc
    - helios-operator-webhook-service.helios-operator-system.svc.cluster.local

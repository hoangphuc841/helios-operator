apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base configuration
bases:
  - ../../base

# Development-specific patches
patches:
  - target:
      kind: Deployment
      name: controller-manager
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: "debug"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENABLE_WEBHOOKS
          value: "true"

# Development-specific resources
resources:
  - ../../cert-manager

# Name prefix for development
namePrefix: dev-

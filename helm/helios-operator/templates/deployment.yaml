apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helios-operator.fullname" . }}
  namespace: {{ include "helios-operator.namespace" . }}
  labels:
    {{- include "helios-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "helios-operator.annotations" . | nindent 4 }}
spec:
  {{- if not (.Values.autoscaling.enabled | default false) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helios-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "helios-operator.annotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "helios-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helios-operator.serviceAccountName" . }}
      securityContext:
        {{- include "helios-operator.podSecurityContext" . | nindent 8 }}
      {{- if .Values.leaderElection.enabled }}
      containers:
      - name: manager
        securityContext:
          {{- include "helios-operator.securityContext" . | nindent 10 }}
        image: {{ include "helios-operator.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --leader-elect
        - --leader-elect-resource-name={{ .Values.leaderElection.resourceName }}
        - --leader-elect-resource-namespace={{ .Values.leaderElection.resourceNamespace }}
        - --leader-elect-lease-duration={{ .Values.leaderElection.leaseDuration }}
        - --leader-elect-renew-deadline={{ .Values.leaderElection.renewDeadline }}
        - --leader-elect-retry-period={{ .Values.leaderElection.retryPeriod }}
        env:
          {{- include "helios-operator.env" . | nindent 10 }}
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      containers:
      - name: manager
        securityContext:
          {{- include "helios-operator.securityContext" . | nindent 10 }}
        image: {{ include "helios-operator.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          {{- include "helios-operator.env" . | nindent 10 }}
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

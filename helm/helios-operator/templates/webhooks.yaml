{{- if .Values.webhook.enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "helios-operator.fullname" . }}-validating-webhook-configuration
  labels:
    {{- include "helios-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "helios-operator.annotations" . | nindent 4 }}
    {{- with .Values.webhook.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
webhooks:
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: {{ include "helios-operator.fullname" . }}-webhook-service
      namespace: {{ include "helios-operator.namespace" . }}
      path: /validate-platform-helios-io-v1-heliosapp
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  name: vheliosapp.kb.io
  sideEffects: None
  timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  rules:
  - apiGroups:
    - platform.helios.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - heliosapps

---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "helios-operator.fullname" . }}-mutating-webhook-configuration
  labels:
    {{- include "helios-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "helios-operator.annotations" . | nindent 4 }}
    {{- with .Values.webhook.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
webhooks:
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: {{ include "helios-operator.fullname" . }}-webhook-service
      namespace: {{ include "helios-operator.namespace" . }}
      path: /mutate-platform-helios-io-v1-heliosapp
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  name: mheliosapp.kb.io
  sideEffects: None
  timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  rules:
  - apiGroups:
    - platform.helios.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - heliosapps

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helios-operator.fullname" . }}-webhook-service
  namespace: {{ include "helios-operator.namespace" . }}
  labels:
    {{- include "helios-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
  annotations:
    {{- include "helios-operator.annotations" . | nindent 4 }}
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
    name: webhook
  selector:
    {{- include "helios-operator.selectorLabels" . | nindent 4 }}
{{- end }}

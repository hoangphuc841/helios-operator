{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helios-operator.serviceAccountName" . }}
  namespace: {{ include "helios-operator.namespace" . }}
  labels:
    {{- include "helios-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "helios-operator.annotations" . | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

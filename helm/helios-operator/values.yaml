# Default values for helios-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: helios-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "2.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account for the operator
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod security context
podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: 1

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Environment variables
env: []

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# Service configuration
service:
  type: ClusterIP
  port: 443
  annotations: {}

# Service monitor for Prometheus
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

# Metrics configuration
metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 8443
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}

# Webhook configuration
webhook:
  enabled: true
  failurePolicy: Fail
  timeoutSeconds: 10
  annotations: {}

# CRD management
crd:
  install: true
  upgrade: true
  cleanup: true

# RBAC configuration
rbac:
  create: true
  # ClusterRole rules
  rules: []

# Leader election
leaderElection:
  enabled: true
  resourceName: "501981a2.helios.dev"
  resourceNamespace: "system"
  leaseDuration: "15s"
  renewDeadline: "10s"
  retryPeriod: "2s"

# Namespace configuration
namespace:
  create: true
  name: "system"
  annotations: {}
  labels: {}

# Tekton integration
tekton:
  enabled: true
  # Default Tekton resources to create
  createDefaultResources: true
  # Namespace where Tekton is installed
  namespace: "tekton-pipelines"

# ArgoCD integration
argocd:
  enabled: true
  # Namespace where ArgoCD is installed
  namespace: "argocd"
  # Default project for applications
  defaultProject: "default"

# Logging configuration
logging:
  level: info
  format: json
  development: false

# Feature flags
features:
  # Enable automatic Pipeline generation
  autoPipelineGeneration: true
  # Enable real-time status updates via watches
  realTimeStatusUpdates: true
  # Enable webhook validation
  webhookValidation: true
  # Enable metrics collection
  metricsCollection: true

# Development and debugging
debug:
  enabled: false
  logLevel: debug
  enableProfiling: false

# Additional labels to add to all resources
globalLabels: {}

# Additional annotations to add to all resources
globalAnnotations: {}

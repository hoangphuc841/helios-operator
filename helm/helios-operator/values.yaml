# Default values for helios-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: helios-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "2.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account for the operator
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod security context
podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # Alternative to minAvailable

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Environment variables
env: []

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
    scheme: HTTP
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Startup probe configuration
startupProbe:
  httpGet:
    path: /healthz
    port: 8081
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

# Service configuration
service:
  type: ClusterIP
  port: 443
  annotations: {}

# Service monitor for Prometheus
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

# Metrics configuration
metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 8443
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}

# Webhook configuration
webhook:
  enabled: true
  failurePolicy: Fail
  timeoutSeconds: 10
  annotations: {}

# CRD management
crd:
  install: true
  upgrade: true
  cleanup: true

# RBAC configuration
rbac:
  create: true
  # ClusterRole rules
  rules: []

# Leader election
leaderElection:
  enabled: true
  resourceName: "501981a2.helios.dev"
  resourceNamespace: "system"
  leaseDuration: "15s"
  renewDeadline: "10s"
  retryPeriod: "2s"

# Namespace configuration
namespace:
  create: true
  name: "system"
  annotations: {}
  labels: {}

# Tekton integration
tekton:
  enabled: true
  # Default Tekton resources to create
  createDefaultResources: true
  # Namespace where Tekton is installed
  namespace: "tekton-pipelines"

# ArgoCD integration
argocd:
  enabled: true
  # Namespace where ArgoCD is installed
  namespace: "argocd"
  # Default project for applications
  defaultProject: "default"

# Logging configuration
logging:
  level: info
  format: json
  development: false

# Feature flags
features:
  # Enable automatic Pipeline generation
  autoPipelineGeneration: true
  # Enable real-time status updates via watches
  realTimeStatusUpdates: true
  # Enable webhook validation
  webhookValidation: true
  # Enable metrics collection
  metricsCollection: true

# Development and debugging
debug:
  enabled: false
  logLevel: debug
  enableProfiling: false

# Additional labels to add to all resources
globalLabels: {}

# Additional annotations to add to all resources
globalAnnotations: {}

# Network policies
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# Pod security standards
podSecurity:
  enabled: false
  # Pod Security Standard level: restricted, baseline, privileged
  level: restricted
  # Namespace labels for Pod Security Standards
  namespaceLabels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

# Backup and recovery
backup:
  enabled: false
  schedule: "0 2 * * *" # Daily at 2 AM
  retention: "7d"
  # Velero backup configuration
  velero:
    enabled: false
    namespace: velero

# Monitoring and alerting
monitoring:
  enabled: false
  # PrometheusRule for alerting
  prometheusRule:
    enabled: false
    rules: []
  # Grafana dashboard
  grafana:
    enabled: false
    dashboard: {}

# Security scanning
security:
  # Enable security context constraints (OpenShift)
  scc:
    enabled: false
  # Pod security policies (deprecated, use podSecurity instead)
  psp:
    enabled: false

# High availability configuration
highAvailability:
  enabled: false
  # Multi-zone deployment
  multiZone: false
  # Anti-affinity rules
  antiAffinity: false

# Performance tuning
performance:
  # Garbage collection settings
  gc:
    enabled: true
    interval: "1h"
  # Cache settings
  cache:
    enabled: true
    size: "100Mi"
  # Rate limiting
  rateLimit:
    enabled: false
    requests: 100
    window: "1m"
